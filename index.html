<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            background-color: #000;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page-nav {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            width: min(420px, calc(100vw - 32px));
        }

        .page-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            line-height: 1;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
        }

        .page-nav a:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .main-image {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 640px) {
            .page-nav {
                top: 14px;
                right: 14px;
                gap: 8px;
                width: calc(100vw - 24px);
            }

            .page-nav a {
                font-size: 12px;
                padding: 9px 12px;
            }
        }
    </style>
</head>
<body>
    <nav class="page-nav" aria-label="Primary navigation">
        <a href="aboutme.html">About Me</a>
        <a href="artworks.html">Artworks</a>
        <a href="photographs.html">Photographs</a>
        <a href="contact.html">Contact</a>
    </nav>
    <img class="main-image" src="texture/mainbg.jpg" alt="">
</body>
</html>
