<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }

        body {
            background-color: #000;
            background-image: url("texture/mainbgchun.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body,
        body * {
            cursor: url("texture/mouse_stand.png") 6 6, auto;
        }

        a,
        button,
        [role="button"],
        input[type="button"],
        input[type="submit"] {
            cursor: url("texture/mouse_hover.png") 6 6, pointer;
        }

        .index-button,
        .page-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            line-height: 1;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
        }

        .index-button:hover,
        .page-nav a:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .index-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 12px;
            padding: 9px 12px;
        }

        .page-nav {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            width: min(420px, calc(100vw - 32px));
        }

        @media (max-width: 640px) {
            .index-button {
                top: 14px;
                left: 14px;
            }

            .page-nav {
                top: 14px;
                right: 14px;
                gap: 8px;
                width: calc(100vw - 24px);
            }

            .page-nav a {
                font-size: 12px;
                padding: 9px 12px;
            }
        }
    </style>
</head>
<body>
    <a class="index-button" href="index.html">Index</a>
    <nav class="page-nav" aria-label="Primary navigation">
        <a href="aboutme.html">About Me</a>
        <a href="artworks.html">Artworks</a>
        <a href="photographs.html">Photographs</a>
        <a href="contact.html">Contact</a>
    </nav>
</body>
</html>
